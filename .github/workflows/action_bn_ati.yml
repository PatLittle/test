name: Build BN ATI report

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
  push:
    branches:
      - main
    paths:
      - "BN_ATI_REPORT/scripts/**"
      - "BN_ATI_REPORT/src/**"
      - "BN_ATI_REPORT/templates/**"
      - "BN_ATI_REPORT/package.json"
      - "BN_ATI_REPORT/package-lock.json"
      - ".github/workflows/action_bn_ati.yml"

permissions:
  contents: write

concurrency:
  group: bn-ati-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BN_ATI_REPORT

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BN_ATI_REPORT/scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update persistent DocumentCloud cache
        env:
          DC_USERNAME: ${{ secrets.DC_USERNAME }}
          DC_PASSWORD: ${{ secrets.DC_PASSWORD }}
        run: python scripts/update_doccloud_cache.py

      - name: Build SQLite report database and page
        run: python scripts/build_report.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Inject SQLite byte length for GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("src/app.js")
          db = Path("docs/data.sqlite")
          text = app.read_text(encoding="utf-8")
          marker = "        url: databaseUrl,\n"
          if marker not in text:
              raise SystemExit("Could not find sql.js-httpvfs database config marker in src/app.js")
          length = db.stat().st_size
          replacement = marker + f"        databaseLengthBytes: {length},\n"
          app.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          print(f"Injected databaseLengthBytes={length:,} into build source")
          PY

      - name: Bundle browser application
        run: npm run build

      - name: Restore source after generated build configuration
        run: git checkout -- src/app.js

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Publish report to /BN-ATI/
        working-directory: .
        run: |
          rm -rf BN-ATI
          mkdir -p BN-ATI
          cp -a BN_ATI_REPORT/docs/. BN-ATI/

      - name: Commit refreshed cache and published site
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BN_ATI_REPORT/data/documentcloud_cache.jsonl BN_ATI_REPORT/docs/ BN-ATI/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update BN ATI report [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
