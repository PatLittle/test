name: Build BN ATI report

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
  push:
    branches:
      - main
    paths:
      - "BN_ATI_REPORT/scripts/**"
      - "BN_ATI_REPORT/src/**"
      - "BN_ATI_REPORT/templates/**"
      - "BN_ATI_REPORT/package.json"
      - "BN_ATI_REPORT/package-lock.json"
      - ".github/workflows/action_bn_ati.yml"

permissions:
  contents: write

concurrency:
  group: bn-ati-build
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect build inputs
    runs-on: ubuntu-latest
    outputs:
      documentcloud_changed: ${{ steps.changes.outputs.documentcloud_changed }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect DocumentCloud updater changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          changed=false
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              files="$(git diff --name-only "$BEFORE" "$SHA")"
            else
              files="$(git show --pretty='' --name-only "$SHA")"
            fi
            echo "$files"
            if printf '%s\n' "$files" | grep -Fxq "BN_ATI_REPORT/scripts/update_doccloud_cache.py"; then
              changed=true
            fi
          fi
          echo "documentcloud_changed=$changed" >> "$GITHUB_OUTPUT"

  update-documentcloud:
    name: Update DocumentCloud cache
    needs: detect-changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.documentcloud_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: BN_ATI_REPORT

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BN_ATI_REPORT/scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update persistent DocumentCloud cache
        env:
          DC_USERNAME: ${{ secrets.DC_USERNAME }}
          DC_PASSWORD: ${{ secrets.DC_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== DocumentCloud update start ==="
          date -u
          free -h
          df -h
          python -u scripts/update_doccloud_cache.py
          echo "=== DocumentCloud update complete ==="
          date -u
          ls -lh data/documentcloud_cache.jsonl
          free -h
          df -h

      - name: Commit refreshed DocumentCloud cache
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BN_ATI_REPORT/data/documentcloud_cache.jsonl
          if git diff --cached --quiet; then
            echo "No DocumentCloud cache changes to commit."
          else
            git commit -m "Update DocumentCloud cache [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  build-report:
    name: Build and publish BN ATI report
    needs:
      - detect-changes
      - update-documentcloud
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.update-documentcloud.result == 'success' || needs.update-documentcloud.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: BN_ATI_REPORT

    steps:
      - name: Check out refreshed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BN_ATI_REPORT/scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build SQLite report database, page, and BN funnel
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== report build start ==="
          date -u
          free -h
          df -h
          python -u scripts/build_report.py
          python -u scripts/build_bn_funnel.py
          echo "=== report build complete ==="
          date -u
          ls -lh docs/data.sqlite docs/index.html docs/bn-funnel.json docs/bn-funnel.js
          free -h
          df -h

      - name: Verify SQLite database integrity
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("docs/data.sqlite")
          connection = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          result = connection.execute("PRAGMA quick_check").fetchall()
          facet_columns = connection.execute(
              "PRAGMA table_info(strong_matches)"
          ).fetchall()
          connection.close()
          print("SQLite quick_check:", result)
          if result != [("ok",)]:
              raise SystemExit("SQLite integrity check failed")
          names = {row[1] for row in facet_columns}
          required = {"briefing_note_date_received", "briefing_note_year"}
          if not required.issubset(names):
              raise SystemExit(f"Missing facet columns: {sorted(required - names)}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare cache-busted full SQLite for GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          app = Path("src/app.js")
          html = Path("docs/index.html")
          db = Path("docs/data.sqlite")

          db_hash = hashlib.sha256(db.read_bytes()).hexdigest()
          database_build_id = db_hash[:16]
          app_source_hash = hashlib.sha256(app.read_bytes()).hexdigest()
          asset_build_id = hashlib.sha256(
              f"{db_hash}:{app_source_hash}".encode("utf-8")
          ).hexdigest()[:16]

          text = app.read_text(encoding="utf-8")
          old_url = 'const databaseUrl = new URL("../data.sqlite", import.meta.url).toString();'
          new_url = (
              f'const databaseUrl = new URL("../data.sqlite?v={database_build_id}", '
              'import.meta.url).toString();'
          )
          if old_url not in text:
              raise SystemExit("Could not find databaseUrl declaration in src/app.js")
          app.write_text(text.replace(old_url, new_url, 1), encoding="utf-8")

          html_text = html.read_text(encoding="utf-8")
          old_script = '<script type="module" src="./assets/app.js"></script>'
          new_script = f'<script type="module" src="./assets/app.js?v={asset_build_id}"></script>'
          if old_script not in html_text:
              raise SystemExit("Could not find app.js script tag in docs/index.html")
          html.write_text(html_text.replace(old_script, new_script, 1), encoding="utf-8")

          shutil.rmtree("docs/db", ignore_errors=True)
          print(f"SQLite SHA-256: {db_hash}")
          print(f"SQLite bytes: {db.stat().st_size:,}")
          print(f"Database build ID: {database_build_id}")
          print(f"Asset build ID: {asset_build_id}")
          print("Using one complete SQLite download; HTTP range/chunk reads are disabled.")
          PY

      - name: Bundle browser application
        run: npm run build

      - name: Verify browser assets
        run: |
          test -f docs/assets/app.js
          test -f docs/assets/app.css
          test -f docs/assets/sql-wasm.wasm
          test -f docs/bn-funnel.json
          test -f docs/bn-funnel.js
          test ! -f docs/assets/sqlite.worker.js
          test ! -d docs/db
          grep -q "data.sqlite" docs/assets/app.js
          grep -q "bn-funnel.js" docs/index.html
          grep -q "Briefing Note Match Funnel" docs/index.html
          echo "Browser assets verified: full sql.js database loader and BN Sankey funnel assets."

      - name: Restore source after generated build configuration
        run: git checkout -- src/app.js

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Publish report to /BN-ATI/
        working-directory: .
        run: |
          rm -rf BN-ATI
          mkdir -p BN-ATI
          cp -a BN_ATI_REPORT/docs/. BN-ATI/

      - name: Commit generated report and published site
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BN_ATI_REPORT/docs/ BN-ATI/
          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
          else
            git commit -m "Update BN ATI report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
