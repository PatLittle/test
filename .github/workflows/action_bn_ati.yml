name: Build BN ATI report

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
  push:
    branches:
      - main
    paths:
      - "BN_ATI_REPORT/scripts/**"
      - "BN_ATI_REPORT/src/**"
      - "BN_ATI_REPORT/templates/**"
      - "BN_ATI_REPORT/package.json"
      - "BN_ATI_REPORT/package-lock.json"
      - ".github/workflows/action_bn_ati.yml"

permissions:
  contents: write

concurrency:
  group: bn-ati-build
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect build inputs
    runs-on: ubuntu-latest
    outputs:
      documentcloud_changed: ${{ steps.changes.outputs.documentcloud_changed }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect DocumentCloud updater changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          changed=false
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              files="$(git diff --name-only "$BEFORE" "$SHA")"
            else
              files="$(git show --pretty='' --name-only "$SHA")"
            fi
            echo "$files"
            if printf '%s\n' "$files" | grep -Fxq "BN_ATI_REPORT/scripts/update_doccloud_cache.py"; then
              changed=true
            fi
          fi
          echo "documentcloud_changed=$changed" >> "$GITHUB_OUTPUT"

  update-documentcloud:
    name: Update DocumentCloud cache
    needs: detect-changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.documentcloud_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: BN_ATI_REPORT

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BN_ATI_REPORT/scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update persistent DocumentCloud cache
        env:
          DC_USERNAME: ${{ secrets.DC_USERNAME }}
          DC_PASSWORD: ${{ secrets.DC_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== DocumentCloud update start ==="
          date -u
          free -h
          df -h
          python -u scripts/update_doccloud_cache.py
          echo "=== DocumentCloud update complete ==="
          date -u
          ls -lh data/documentcloud_cache.jsonl
          free -h
          df -h

      - name: Commit refreshed DocumentCloud cache
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BN_ATI_REPORT/data/documentcloud_cache.jsonl
          if git diff --cached --quiet; then
            echo "No DocumentCloud cache changes to commit."
          else
            git commit -m "Update DocumentCloud cache [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  build-report:
    name: Build and publish BN ATI report
    needs:
      - detect-changes
      - update-documentcloud
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.update-documentcloud.result == 'success' || needs.update-documentcloud.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: BN_ATI_REPORT

    steps:
      - name: Check out refreshed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BN_ATI_REPORT/scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build SQLite report database and page
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== report build start ==="
          date -u
          free -h
          df -h
          python -u scripts/build_report.py
          echo "=== report build complete ==="
          date -u
          ls -lh docs/data.sqlite docs/index.html
          free -h
          df -h

      - name: Verify SQLite database integrity
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("docs/data.sqlite")
          connection = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          result = connection.execute("PRAGMA quick_check").fetchall()
          connection.close()
          print("SQLite quick_check:", result)
          if result != [("ok",)]:
              raise SystemExit("SQLite integrity check failed")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare versioned chunked SQLite for GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          app = Path("src/app.js")
          html = Path("docs/index.html")
          db = Path("docs/data.sqlite")
          out_root = Path("docs/db")
          manifest_file = out_root / "versions.json"

          server_chunk_size = 1024 * 1024
          request_chunk_size = 4096
          suffix_length = 3

          db_hasher = hashlib.sha256()
          with db.open("rb") as source:
              while True:
                  block = source.read(4 * 1024 * 1024)
                  if not block:
                      break
                  db_hasher.update(block)
          database_hash = db_hasher.hexdigest()
          database_build_id = database_hash[:16]
          app_source_hash = hashlib.sha256(app.read_bytes()).hexdigest()
          asset_build_id = hashlib.sha256(
              f"{database_hash}:{app_source_hash}".encode("utf-8")
          ).hexdigest()[:16]
          database_length = db.stat().st_size

          out_root.mkdir(parents=True, exist_ok=True)
          for path in out_root.glob("data.sqlite.*"):
              if path.is_file():
                  path.unlink()

          previous_versions = []
          if manifest_file.exists():
              try:
                  previous_versions = json.loads(
                      manifest_file.read_text(encoding="utf-8")
                  ).get("versions", [])
              except Exception:
                  previous_versions = []

          versions = [database_build_id] + [
              value for value in previous_versions if value != database_build_id
          ]
          versions = versions[:2]

          build_dir = out_root / database_build_id
          if build_dir.exists():
              shutil.rmtree(build_dir)
          build_dir.mkdir(parents=True)

          chunk_hasher = hashlib.sha256()
          with db.open("rb") as source:
              index = 0
              while True:
                  block = source.read(server_chunk_size)
                  if not block:
                      break
                  chunk_hasher.update(block)
                  chunk_name = f"data.sqlite.{index:0{suffix_length}d}"
                  (build_dir / chunk_name).write_bytes(block)
                  index += 1

          if chunk_hasher.hexdigest() != database_hash:
              raise SystemExit("Chunked SQLite bytes do not match source database")

          for path in out_root.iterdir():
              if path.is_dir() and path.name not in versions:
                  shutil.rmtree(path)

          manifest_file.write_text(
              json.dumps({
                  "current": database_build_id,
                  "versions": versions,
                  "asset_build_id": asset_build_id,
              }, indent=2) + "\n",
              encoding="utf-8",
          )

          text = app.read_text(encoding="utf-8")
          old_url = 'const databaseUrl = new URL("../data.sqlite", import.meta.url).toString();'
          new_url = (
              f'const databaseUrlPrefix = new URL("../db/{database_build_id}/data.sqlite.", '
              'import.meta.url).toString();'
          )
          if old_url not in text:
              raise SystemExit("Could not find databaseUrl declaration in src/app.js")
          text = text.replace(old_url, new_url, 1)

          old_config = (
              '        serverMode: "full",\n'
              '        requestChunkSize: 4096,\n'
              '        url: databaseUrl,'
          )
          new_config = (
              '        serverMode: "chunked",\n'
              f'        requestChunkSize: {request_chunk_size},\n'
              '        urlPrefix: databaseUrlPrefix,\n'
              f'        serverChunkSize: {server_chunk_size},\n'
              f'        databaseLengthBytes: {database_length},\n'
              f'        suffixLength: {suffix_length},'
          )
          if old_config not in text:
              raise SystemExit("Could not find sql.js-httpvfs full-mode config in src/app.js")
          app.write_text(text.replace(old_config, new_config, 1), encoding="utf-8")

          html_text = html.read_text(encoding="utf-8")
          old_script = '<script type="module" src="./assets/app.js"></script>'
          new_script = f'<script type="module" src="./assets/app.js?v={asset_build_id}"></script>'
          if old_script not in html_text:
              raise SystemExit("Could not find app.js script tag in docs/index.html")
          html.write_text(html_text.replace(old_script, new_script, 1), encoding="utf-8")

          print(f"SQLite SHA-256: {database_hash}")
          print(f"SQLite bytes: {database_length:,}")
          print(f"Database build ID: {database_build_id}")
          print(f"Asset build ID: {asset_build_id}")
          print(f"Created {index:,} chunks in {build_dir}")
          print(f"Retained chunk generations: {versions}")
          PY

      - name: Bundle browser application
        run: npm run build

      - name: Restore source after generated build configuration
        run: git checkout -- src/app.js

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Publish report to /BN-ATI/
        working-directory: .
        run: |
          rm -rf BN-ATI
          mkdir -p BN-ATI
          cp -a BN_ATI_REPORT/docs/. BN-ATI/

      - name: Commit generated report and published site
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BN_ATI_REPORT/docs/ BN-ATI/
          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
          else
            git commit -m "Update BN ATI report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
