name: Build and deploy BN ATI report

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
  push:
    branches:
      - main
    paths:
      - "BN_ATI_REPORT/**"
      - ".github/workflows/action_bn_ati.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bn-ati-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BN_ATI_REPORT

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BN_ATI_REPORT/scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update persistent DocumentCloud cache
        env:
          DOCUMENTCLOUD_USERNAME: ${{ secrets.DOCUMENTCLOUD_USERNAME }}
          DOCUMENTCLOUD_PASSWORD: ${{ secrets.DOCUMENTCLOUD_PASSWORD }}
        run: python scripts/update_doccloud_cache.py

      - name: Build SQLite report database and page
        run: python scripts/build_report.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle browser application
        run: npm run build

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Commit refreshed cache and generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/documentcloud_cache.jsonl docs/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update BN ATI report ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BN_ATI_REPORT/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
