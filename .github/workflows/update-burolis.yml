name: Update Burolis data

on:
  workflow_dispatch:
    inputs:
      geojson_only:
        description: Geocode the saved bilingual snapshot
        type: boolean
        default: false
      geocode_max_requests:
        description: Maximum new GeoLocator requests this run (0 means all)
        type: number
        default: 0
  schedule:
    - cron: "30 8 * * 1"

permissions:
  contents: write

concurrency:
  group: update-burolis-data
  cancel-in-progress: false

jobs:
  scrape:
    name: Download and merge Burolis data
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: burolis/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r burolis/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s burolis/tests -v

      - name: Download and geocode Burolis data
        env:
          PYTHONUNBUFFERED: "1"
          BUROLIS_GEOCODE_MAX_REQUESTS: ${{ inputs.geocode_max_requests || 0 }}
        run: python -u burolis/scrape_burolis.py ${{ inputs.geojson_only && '--geojson-only' || '' }}

      - name: Commit changed data and statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add burolis/data/ burolis/README.md OpenData2OpenMaps/burolis.geojson
          if git diff --cached --quiet; then
            echo "No Burolis data changes to commit."
          else
            git commit -m "Update Burolis data and statistics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
