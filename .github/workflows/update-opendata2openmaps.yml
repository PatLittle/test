name: Update OpenData2OpenMaps GeoJSON

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"

permissions:
  contents: write

concurrency:
  group: update-opendata2openmaps
  cancel-in-progress: false

jobs:
  build:
    name: Convert open data to GeoJSON
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests shapely

      - name: Build GAC GeoJSON
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u OpenData2OpenMaps/scripts/gac_to_geojson.py

      - name: Build TBS FCSI GeoJSON
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u OpenData2OpenMaps/scripts/tbs_to_geojson.py

      - name: Commit changed GeoJSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenData2OpenMaps/geodata/
          if git diff --cached --quiet; then
            echo "No GeoJSON changes to commit."
          else
            git commit -m "Update OpenData2OpenMaps GeoJSON [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  dfrp:
    name: Build DFRP spatial data
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: OpenData2OpenMaps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DFRP dependencies
        run: python -m pip install geopandas pyogrio pyarrow lxml requests

      - name: Test DFRP export and image reuse
        run: python OpenData2OpenMaps/scripts/test_dfrp_to_geodata.py

      - name: Restore DFRP image cache
        id: dfrp-cache
        uses: actions/cache/restore@v4
        with:
          path: OpenData2OpenMaps/.dfrp-cache/images.sqlite3
          key: dfrp-images-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dfrp-images-v1-

      - name: Build DFRP GeoJSON, GeoPackages and GeoParquet
        id: dfrp-build
        run: python -u OpenData2OpenMaps/scripts/dfrp_to_geodata.py

      - name: Save DFRP image cache
        if: steps.dfrp-build.outputs.cache_updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: OpenData2OpenMaps/.dfrp-cache/images.sqlite3
          key: ${{ steps.dfrp-cache.outputs.cache-primary-key }}

      - name: Commit changed DFRP spatial data
        shell: bash
        working-directory: OpenData2OpenMaps/geodata/dfrp
        run: |
          git add -- dfrp_parcels.geojson dfrp_structures.geojson \
            dfrp_parcels.parquet dfrp_structures.parquet dfrp.gpkg
          if git diff --cached --quiet; then
            echo "No tracked DFRP data changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update DFRP spatial data [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload DFRP spatial data
        uses: actions/upload-artifact@v4
        with:
          name: dfrp-geodata
          path: OpenData2OpenMaps/geodata/dfrp/
          if-no-files-found: error
