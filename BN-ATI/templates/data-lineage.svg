<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="lineage-title lineage-desc">
  <title id="lineage-title">BN plus ATI report data lineage</title>
  <desc id="lineage-desc">Diagram showing the three Open Government CKAN inputs, CKAN organization aliases, the persistent DocumentCloud cache, matching and enrichment logic, SQLite output tables, and the published BN ATI static site.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1f2937"/>
    </marker>
    <style>
      .canvas { fill: url(#bg-gradient); }
      .lane { stroke: #dbe3ef; stroke-width: 1.2; stroke-dasharray: 5 7; fill: #ffffff66; }
      .lane-title { font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #475569; text-transform: uppercase; }
      .title { font-family: Fraunces, Georgia, serif; font-size: 44px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #475569; }
      .card { stroke-width: 1.5; rx: 16; filter: url(#soft-shadow); }
      .source { fill: #eaf2ff; stroke: #95bdf8; }
      .support { fill: #f4efff; stroke: #b9a4eb; }
      .process { fill: #fff4e6; stroke: #f5b26b; }
      .output { fill: #e8fbf7; stroke: #74d8cd; }
      .artifact { fill: #edf5ff; stroke: #8eb6ee; }
      .h { font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .t { font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .s { font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #334155; }
      .label-box { fill: #ffffff; stroke: #d0dae8; stroke-width: 1; rx: 8; }
      .label { font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .flow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .flow-soft { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="8" y="8" width="1384" height="1024" rx="26" class="canvas"/>
  <rect x="28" y="96" width="1344" height="176" rx="16" class="lane"/>
  <rect x="28" y="292" width="1344" height="360" rx="16" class="lane"/>
  <rect x="28" y="672" width="1344" height="176" rx="16" class="lane"/>
  <rect x="28" y="868" width="1344" height="136" rx="16" class="lane"/>

  <text x="58" y="62" class="title">BN + ATI Report Pipeline</text>
  <text x="58" y="90" class="subtitle">From Open Government and DocumentCloud inputs to a pre-built SQLite-backed static report</text>

  <text x="52" y="116" class="lane-title">Inputs</text>
  <text x="52" y="312" class="lane-title">Matching and Enrichment</text>
  <text x="52" y="692" class="lane-title">SQLite Output Tables</text>
  <text x="52" y="888" class="lane-title">Published Site</text>

  <rect x="48" y="128" width="250" height="124" class="card source"/>
  <text x="70" y="162" class="t">Open Data A</text>
  <text x="70" y="188" class="s">Briefing Note Titles and Numbers</text>
  <text x="70" y="214" class="s">owner_org + tracking_number</text>
  <text x="70" y="238" class="s">+ owner_org_title</text>

  <rect x="312" y="128" width="250" height="124" class="card source"/>
  <text x="334" y="162" class="t">Open Data B</text>
  <text x="334" y="188" class="s">ATI informal-request analytics</text>
  <text x="334" y="214" class="s">owner_org + Request Number</text>
  <text x="334" y="238" class="s">informal count + ATI UID</text>

  <rect x="576" y="128" width="250" height="124" class="card source"/>
  <text x="598" y="162" class="t">Open Data C</text>
  <text x="598" y="188" class="s">Completed ATI summaries</text>
  <text x="598" y="214" class="s">owner_org + request_number</text>
  <text x="598" y="238" class="s">summary_en + summary_fr</text>

  <rect x="840" y="128" width="250" height="124" class="card support"/>
  <text x="862" y="162" class="t">CKAN organizations</text>
  <text x="862" y="188" class="s">organization_list API</text>
  <text x="862" y="214" class="s">EN/FR names, titles, extras</text>
  <text x="862" y="238" class="s">canonical owner_org aliases</text>

  <rect x="1104" y="128" width="250" height="124" class="card support"/>
  <text x="1126" y="162" class="t">DocumentCloud cache</text>
  <text x="1126" y="188" class="s">persistent JSONL cache</text>
  <text x="1126" y="214" class="s">request + organization metadata</text>
  <text x="1126" y="238" class="s">Open by Default URLs</text>

  <rect x="210" y="342" width="290" height="116" class="card process"/>
  <text x="232" y="376" class="t">1. Aggregate B</text>
  <text x="232" y="402" class="s">group owner_org + request number</text>
  <text x="232" y="428" class="s">sum informal requests; collect UIDs</text>

  <rect x="555" y="342" width="290" height="116" class="card process"/>
  <text x="577" y="376" class="t">2. Stream C + join B</text>
  <text x="577" y="402" class="s">C processed in 5,000-row pages</text>
  <text x="577" y="428" class="s">join owner_org + request_number</text>

  <rect x="900" y="342" width="290" height="116" class="card process"/>
  <text x="922" y="376" class="t">3. Match A references</text>
  <text x="922" y="402" class="s">same owner_org</text>
  <text x="922" y="428" class="s">tracking_number found in ATI summary</text>

  <rect x="250" y="508" width="290" height="116" class="card process"/>
  <text x="272" y="542" class="t">4. Separate weak IDs</text>
  <text x="272" y="568" class="s">weak values retained for review</text>
  <text x="272" y="594" class="s">remaining records become strong matches</text>

  <rect x="590" y="508" width="290" height="116" class="card process"/>
  <text x="612" y="542" class="t">5. Resolve organization</text>
  <text x="612" y="568" class="s">normalize names and aliases to owner_org</text>
  <text x="612" y="594" class="s">request-number fallback only when unique</text>

  <rect x="930" y="508" width="290" height="116" class="card process"/>
  <text x="952" y="542" class="t">6. DocumentCloud enrich</text>
  <text x="952" y="568" class="s">join canonical owner_org + request</text>
  <text x="952" y="594" class="s">add Open by Default and diagnostics</text>

  <rect x="70" y="716" width="280" height="108" class="card output"/>
  <text x="92" y="750" class="t">strong_matches</text>
  <text x="92" y="776" class="s">matched BN + ATI records</text>
  <text x="92" y="800" class="s">with DocumentCloud enrichment</text>

  <rect x="390" y="716" width="280" height="108" class="card output"/>
  <text x="412" y="750" class="t">weak_matches</text>
  <text x="412" y="776" class="s">weak BN identifiers separated</text>
  <text x="412" y="800" class="s">for review and charting</text>

  <rect x="710" y="716" width="280" height="108" class="card output"/>
  <text x="732" y="750" class="t">match diagnostics</text>
  <text x="732" y="776" class="s">DocumentCloud match methods</text>
  <text x="732" y="800" class="s">organization alias crosswalk</text>

  <rect x="1030" y="716" width="280" height="108" class="card output"/>
  <text x="1052" y="750" class="t">meta_counts</text>
  <text x="1052" y="776" class="s">source counts and result metrics</text>
  <text x="1052" y="800" class="s">build date and cache statistics</text>

  <rect x="440" y="904" width="520" height="80" class="card artifact"/>
  <text x="462" y="938" class="h">BN-ATI/ static report</text>
  <text x="462" y="964" class="s">chunked SQLite + sql.js-httpvfs + DataTables + Chart.js on GitHub Pages</text>

  <path d="M437 252 L437 342" class="flow"/>
  <path d="M701 252 L701 342" class="flow"/>
  <path d="M500 400 L555 400" class="flow"/>
  <path d="M173 252 L173 482 L1000 482 L1000 458" class="flow"/>
  <path d="M845 400 L900 400" class="flow"/>
  <path d="M1045 458 L1045 508" class="flow"/>
  <path d="M395 624 L395 674 L210 674 L210 716" class="flow"/>
  <path d="M395 624 L395 716 L530 716" class="flow"/>
  <path d="M965 252 L965 482 L735 482 L735 508" class="flow-soft"/>
  <path d="M1229 252 L1229 566 L1220 566" class="flow-soft"/>
  <path d="M880 566 L930 566" class="flow"/>
  <path d="M1075 624 L1075 686 L210 686 L210 716" class="flow"/>
  <path d="M735 624 L735 686 L850 686 L850 716" class="flow-soft"/>
  <path d="M1075 624 L1075 686 L1170 686 L1170 716" class="flow-soft"/>
  <path d="M210 824 L210 856 L560 856 L560 904" class="flow"/>
  <path d="M530 824 L530 880 L640 880 L640 904" class="flow"/>
  <path d="M850 824 L850 880 L760 880 L760 904" class="flow"/>
  <path d="M1170 824 L1170 856 L840 856 L840 904" class="flow"/>

  <rect x="540" y="458" width="320" height="30" class="label-box"/>
  <text x="554" y="479" class="label">join key: owner_org + normalized request number</text>
  <rect x="840" y="470" width="360" height="30" class="label-box"/>
  <text x="854" y="491" class="label">match: tracking number occurs in EN or FR summary</text>
</svg>
