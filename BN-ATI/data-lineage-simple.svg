<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">BN and ATI report data pipeline</title>
  <desc id="desc">Three Open Government datasets and DocumentCloud are matched by organization, ATI request and briefing-note reference to create the SQLite report.</desc>
  <defs>
    <style>
      .box{rx:14;ry:14;stroke:#284f7a;stroke-width:2}
      .source{fill:#e8f1f8}.support{fill:#f4efe4}.process{fill:#e9f4ee}.output{fill:#eee8f5}
      .h{font:700 20px Arial,sans-serif;fill:#26374a}.t{font:600 15px Arial,sans-serif;fill:#26374a}
      .arrow{stroke:#657789;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#657789"/>
    </marker>
  </defs>

  <rect x="20" y="28" width="205" height="74" class="box source"/>
  <text x="122" y="58" text-anchor="middle" class="h">Briefing notes</text>
  <text x="122" y="82" text-anchor="middle" class="t">references + dates</text>

  <rect x="20" y="142" width="205" height="74" class="box source"/>
  <text x="122" y="172" text-anchor="middle" class="h">ATI analytics</text>
  <text x="122" y="196" text-anchor="middle" class="t">informal requests</text>

  <rect x="20" y="256" width="205" height="74" class="box source"/>
  <text x="122" y="286" text-anchor="middle" class="h">ATI summaries</text>
  <text x="122" y="310" text-anchor="middle" class="t">completed requests</text>

  <rect x="285" y="60" width="180" height="74" class="box support"/>
  <text x="375" y="90" text-anchor="middle" class="h">CKAN orgs</text>
  <text x="375" y="114" text-anchor="middle" class="t">name aliases</text>

  <rect x="285" y="226" width="180" height="74" class="box support"/>
  <text x="375" y="256" text-anchor="middle" class="h">DocumentCloud</text>
  <text x="375" y="280" text-anchor="middle" class="t">Open by Default</text>

  <rect x="535" y="115" width="210" height="130" class="box process"/>
  <text x="640" y="153" text-anchor="middle" class="h">Match records</text>
  <text x="640" y="182" text-anchor="middle" class="t">same organization</text>
  <text x="640" y="205" text-anchor="middle" class="t">ATI request</text>
  <text x="640" y="228" text-anchor="middle" class="t">BN reference</text>

  <rect x="805" y="75" width="170" height="86" class="box output"/>
  <text x="890" y="108" text-anchor="middle" class="h">SQLite</text>
  <text x="890" y="134" text-anchor="middle" class="t">strong + weak</text>

  <rect x="805" y="215" width="170" height="86" class="box output"/>
  <text x="890" y="248" text-anchor="middle" class="h">Static report</text>
  <text x="890" y="274" text-anchor="middle" class="t">table + timeline</text>

  <path d="M225 65 C310 65 440 130 535 154" class="arrow"/>
  <path d="M225 179 L535 179" class="arrow"/>
  <path d="M225 293 C315 293 445 235 535 210" class="arrow"/>
  <path d="M465 97 C500 97 510 132 535 145" class="arrow"/>
  <path d="M465 263 C500 263 510 230 535 216" class="arrow"/>
  <path d="M745 162 C775 150 785 128 805 120" class="arrow"/>
  <path d="M745 210 C775 220 785 244 805 253" class="arrow"/>
</svg>
